    <style>
        .numeric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr) 80px;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #ddd;
            background: #f5f5f5;
            color: #666;
            user-select: none;
        }
        .tag-chip.selected {
            background: #E8F0FE;
            color: #004ac6;
            border-color: #004ac6;
        }
        .tag-chip.create-btn {
            background: #f5f5f5;
            color: #999;
            border: 1px dashed #bbb;
        }
        .tag-chip.create-btn:hover {
            border-color: #004ac6;
            color: #004ac6;
        }
        .tag-chip:hover:not(.create-btn) {
            transform: scale(1.05);
        }
        .parent-tab {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            color: #64748b;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .parent-tab.active {
            background: #E8F0FE;
            color: #004ac6;
            border-color: #004ac6;
            font-weight: 600;
        }
        .parent-tab .tab-icon {
            font-size: 16px;
        }
        .child-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
        }
        .child-btn:hover {
            background: #f8f9ff;
        }
        .child-btn.selected {
            border-color: #004ac6;
            background: #E8F0FE;
        }
        .child-btn .child-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #f1f5f9;
            transition: all 0.15s;
        }
        .child-btn.selected .child-icon {
            background: #dbeafe;
        }
        .child-label {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            line-height: 1.2;
        }
        .child-btn.selected .child-label {
            color: #004ac6;
            font-weight: 600;
        }
        .empty-sub-msg {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 24px 0;
            grid-column: 1 / -1;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                <button id="tab-income" class="flex-1 py-2 text-label-caps font-label-caps text-on-surface-variant hover:text-secondary transition-all">收入</button>
            </div>
            <!-- 金额输入行 -->
            <div class="flex justify-between items-end border-b border-outline-variant pb-2">
                <div class="flex flex-col">
                    <span id="amount-label" class="text-label-caps font-label-caps text-danger-expense uppercase tracking-wider">支出金额</span>
                    <div class="flex items-center gap-1">
                        <span class="text-headline-md font-headline-md text-on-surface-variant">¥</span>
                        <input id="amount-input" class="w-full bg-transparent border-none focus:ring-0 text-display-hero-mobile font-display-hero-mobile text-primary placeholder:text-outline-variant p-0" placeholder="0.00" type="text" inputmode="decimal">
                    </div>

                <!-- 保存按钮（主界面常驻） -->

            <div id="category-grid" class="grid grid-cols-4 gap-y-6 pt-2">

                    <span class="material-symbols-outlined animate-spin mr-2">progress_activity</span>

        </div>

    <script>
    (function () {
        'use strict';

        // ===== 状态 =====
        var currentType = 'EXPENSE'; // EXPENSE | INCOME
        var selectedCategoryId = null;
        var selectedCategoryName = '';
        var amountStr = ''; // 用户输入的金额字符串
        var editId = null; // 编辑模式下的账单 ID
        var originalBillTime = ''; // 编辑模式下保留原始时间
        var selectedDate = ''; // 用户选择的日期 (YYYY-MM-DD)

        // ===== 标签 =====
        var tags = []; // {id, name}
        var selectedTagIds = [];
        var tagContainer = document.getElementById('tag-container');

        function loadTags() {
            Auth.fetchApi('/finance/tags')
            .then(function (result) {
                if (result.code !== 0) {
                    tagContainer.innerHTML = '<div class="py-2 text-body-sm text-on-surface-variant">加载失败</div>';
                    return;
                }
                tags = result.data && result.data.list ? result.data.list : [];
                renderTags();
            });
        }

        function renderTags() {
            var html = '';
            var displayTags = tags.slice(0, 12);
            displayTags.forEach(function (tag) {
                var isSelected = selectedTagIds.indexOf(tag.id) !== -1;
                html += '<span class="tag-chip' + (isSelected ? ' selected' : '') + '" data-id="' + tag.id + '" onclick="window.toggleTag(' + tag.id + ')">' + Auth.escapeHtml(tag.name) + '</span>';
            });
            if (tags.length > 12) {
                html += '<span class="text-body-sm text-on-surface-variant self-center">...</span>';
            }
            html += '<span class="tag-chip create-btn" onclick="window.showTagCreateOverlay()">+ 新建</span>';
            tagContainer.innerHTML = html;
        }

        window.toggleTag = function(id) {
            var idx = selectedTagIds.indexOf(id);
            if (idx === -1) {
                selectedTagIds.push(id);
            } else {
                selectedTagIds.splice(idx, 1);
            }
            renderTags();
        };

        // 标签新建弹窗
        var tagOverlay = document.getElementById('tag-create-overlay');
        var tagInput = document.getElementById('tag-create-input');

        window.showTagCreateOverlay = function() {
            tagInput.value = '';
            tagOverlay.classList.remove('hidden');
            tagOverlay.classList.add('flex');
            tagInput.focus();
        };

        window.hideTagCreateOverlay = function() {
            tagOverlay.classList.add('hidden');
            tagOverlay.classList.remove('flex');
        };

        window.createNewTag = function() {
            var name = tagInput.value.trim();
            if (!name) {
                showToast('请输入标签名称');
                return;
            }
            if (name.length > 16) {
                showToast('标签名不能超过 16 个字符');
                return;
            }

            Auth.fetchApi('/finance/tags', {
                method: 'POST',
                body: JSON.stringify({ name: name })
            })
            .then(function (result) {
                if (result.code !== 0) {
                    showToast(result.msg || '创建失败');
                    return;
                }
                tags.push({ id: result.data.id, name: name });
                selectedTagIds.push(result.data.id);
                renderTags();
                window.hideTagCreateOverlay();
            });
        };

        tagInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                window.createNewTag();
            }
        });

        // ===== DOM =====
        var amountInput = document.getElementById('amount-input');
        var remarkInput = document.getElementById('remark-input');
        var tabExpense = document.getElementById('tab-expense');
        var tabIncome = document.getElementById('tab-income');
        var amountLabel = document.getElementById('amount-label');
        var categoryGrid = document.getElementById('category-grid');
        var keySave = document.getElementById('key-save');

        // ===== 数字键盘 =====
        var keyBtns = document.querySelectorAll('.key-btn');
        var backspaceBtn = document.getElementById('key-backspace');
        var keyboardOverlay = document.getElementById('keyboard-overlay');
        var keyboardAmountDisplay = document.getElementById('keyboard-amount-display');

        function updateAmountDisplay() {
            amountInput.value = amountStr || '';
            keyboardAmountDisplay.textContent = (amountStr || '0.00');
        }

        function showKeyboard() {
            keyboardOverlay.classList.remove('hidden');
            keyboardOverlay.classList.add('flex');
            updateAmountDisplay();
        }

        function hideKeyboard() {
            keyboardOverlay.classList.add('hidden');
            keyboardOverlay.classList.remove('flex');
        }
        window.hideKeyboard = hideKeyboard;

        // ===== 日期选择器 =====
        var dateOverlay = document.getElementById('date-overlay');
        var dateInput = document.getElementById('date-input');

        function showDatePicker() {
            // 预填当前选择的日期或今天
            if (selectedDate) {
                dateInput.value = selectedDate;
            } else if (originalBillTime) {
                dateInput.value = originalBillTime.substring(0, 10);
            } else {
                dateInput.value = new Date().toISOString().slice(0, 10);
            }
            dateOverlay.classList.remove('hidden');
            dateOverlay.classList.add('flex');
            dateInput.focus();
        }
        window.showDatePicker = showDatePicker;

        function hideDatePicker() {
            dateOverlay.classList.add('hidden');
            dateOverlay.classList.remove('flex');
        }
        window.hideDatePicker = hideDatePicker;

        function selectToday() {
            dateInput.value = new Date().toISOString().slice(0, 10);
        }
        window.selectToday = selectToday;

        function confirmDate() {
            var val = dateInput.value; // YYYY-MM-DD
            if (!val) { hideDatePicker(); return; }
            selectedDate = val;
            // 更新时间标签显示
            var parts = val.split('-');
            var display = parts[0] + '/' + parts[1] + '/' + parts[2];
            document.getElementById('time-label').innerHTML = '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: \'FILL\' 1;">schedule</span>' + display;
            hideDatePicker();
        }
        window.confirmDate = confirmDate;

        // 日历按钮打开日期选择器
        document.getElementById('btn-calendar').addEventListener('click', showDatePicker);

        // 金额输入框现在可以直接打字输入（物理键盘）
        // document.querySelector('#amount-input').parentElement.addEventListener('click', function () {
        //     showKeyboard();
        // });

        keyBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                var val = btn.textContent.trim();
                if (val === '.') {
                    if (amountStr.indexOf('.') !== -1) return;
                    if (amountStr === '') amountStr = '0';
                } else if (amountStr === '0' && val !== '.') {
                    amountStr = val;
                } else {
                    // 限制小数点后最多两位
                    var dotIdx = amountStr.indexOf('.');
                    if (dotIdx !== -1 && amountStr.length - dotIdx > 2) return;
                    if (amountStr.length >= 12) return;
                }
                amountStr += val;
                updateAmountDisplay();
            });
        });

        backspaceBtn.addEventListener('click', function () {
            amountStr = amountStr.slice(0, -1);
            updateAmountDisplay();
        });

        // ===== 类型切换 =====
        function setActiveType(type) {
            currentType = type;
            if (type === 'EXPENSE') {
                tabExpense.className = 'flex-1 py-2 text-label-caps font-label-caps bg-white text-danger-expense shadow-sm rounded-md transition-all';
                tabIncome.className = 'flex-1 py-2 text-label-caps font-label-caps text-on-surface-variant hover:text-secondary transition-all';
                amountLabel.textContent = '支出金额';
                amountLabel.className = 'text-label-caps font-label-caps text-danger-expense uppercase tracking-wider';
                amountInput.style.color = '';
            } else {
                tabIncome.className = 'flex-1 py-2 text-label-caps font-label-caps bg-white text-success-growth shadow-sm rounded-md transition-all';
                tabExpense.className = 'flex-1 py-2 text-label-caps font-label-caps text-on-surface-variant hover:text-danger-expense transition-all';
                amountLabel.textContent = '收入金额';
                amountLabel.className = 'text-label-caps font-label-caps text-success-growth uppercase tracking-wider';
            }
            loadCategories(type);
        }

        tabExpense.addEventListener('click', function () { setActiveType('EXPENSE'); });
        tabIncome.addEventListener('click', function () { setActiveType('INCOME'); });

        // ===== 分类（两级） =====
        var allCats = [];
        var parents = [];
        var activeParentId = null;

        function loadCategories(type) {
            selectedCategoryId = null;
            selectedCategoryName = '';
            activeParentId = null;

            var tabsContainer = document.getElementById('category-tabs');
            var gridContainer = document.getElementById('category-grid');
            tabsContainer.innerHTML = '';
            gridContainer.innerHTML = '<div class="col-span-4 flex items-center justify-center py-8 text-on-surface-variant"><span class="material-symbols-outlined animate-spin mr-2">progress_activity</span>加载分类中...</div>';

            Auth.fetchApi('/categories?type=' + type)
            .then(function (result) {
                if (result.code !== 0) {
                    gridContainer.innerHTML = '<div class="col-span-4 text-center text-on-surface-variant py-8">加载分类失败</div>';
                    return;
                }

                allCats = result.data;

                var parentMap = {};
                var childrenMap = {};
                var parentList = [];

                allCats.forEach(function (cat) {
                    var pid = cat.parent_id || 0;
                    if (pid === 0) {
                        parentMap[cat.id] = { id: cat.id, name: cat.name, icon: cat.icon || 'more_horiz', children: [] };
                        parentList.push(cat.id);
                    } else {
                        if (!childrenMap[pid]) childrenMap[pid] = [];
                        childrenMap[pid].push(cat);
                    }
                });

                parentList.forEach(function (pid) {
                    parentMap[pid].children = childrenMap[pid] || [];
                });

                parents = parentList.map(function (pid) { return parentMap[pid]; });

                renderTabs();

                if (parents.length > 0) {
                    selectParent(parents[0].id);
                }
            });
        }

        function renderTabs() {
            var tabsContainer = document.getElementById('category-tabs');
            var html = '';
            parents.forEach(function (p) {
                html += '<div class="parent-tab' + (activeParentId === p.id ? ' active' : '') + '" data-parent-id="' + p.id + '" onclick="window.selectParentTab(' + p.id + ')">';
                html += '<span class="tab-icon material-symbols-outlined" style="font-size:16px">' + p.icon + '</span>';
                html += Auth.escapeHtml(p.name);
                html += '</div>';
            });
            tabsContainer.innerHTML = html;
        }

        window.selectParentTab = function(parentId) {
            activeParentId = parentId;
            renderTabs();
            renderChildren(parentId);
        };

        function selectParent(parentId) {
            activeParentId = parentId;
            renderTabs();
            renderChildren(parentId);
        }

        function renderChildren(parentId) {
            var parent = parents.find(function (p) { return p.id === parentId; });
            if (!parent) return;

            var gridContainer = document.getElementById('category-grid');
            var children = parent.children || [];

            if (children.length === 0) {
                var html = '';
                html += '<div class="col-span-4 empty-sub-msg">该分类暂无子分类</div>';
                html += '<div class="col-span-4 flex flex-col items-center gap-2">';
                html += '<div class="child-btn selected" data-id="' + parent.id + '" data-name="' + Auth.escapeHtml(parent.name) + '" data-icon="' + parent.icon + '" onclick="window.selectCategory(this)">';
                html += '<div class="child-icon" style="background:' + getCategoryBgColor(parent.icon) + '">';
                html += '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1; font-size:22px;">' + parent.icon + '</span>';
                html += '</div>';
                html += '<div class="child-label" style="color:#004ac6;font-weight:600">' + Auth.escapeHtml(parent.name) + '</div>';
                html += '</div></div>';
                gridContainer.innerHTML = html;

                selectedCategoryId = parent.id;
                selectedCategoryName = parent.name;
            } else {
                var html = '';
                children.forEach(function (child) {
                    html += '<div class="child-btn" data-id="' + child.id + '" data-name="' + Auth.escapeHtml(child.name) + '" data-icon="' + (child.icon || 'more_horiz') + '" onclick="window.selectCategory(this)">';
                    html += '<div class="child-icon" style="background:' + getCategoryBgColor(child.icon) + '">';
                    html += '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1; font-size:22px;">' + (child.icon || 'more_horiz') + '</span>';
                    html += '</div>';
                    html += '<div class="child-label">' + Auth.escapeHtml(child.name) + '</div>';
                    html += '</div>';
                });
                gridContainer.innerHTML = html;
            }
        }

        window.selectCategory = function (el) {
            document.querySelectorAll('.child-btn').forEach(function (b) {
                b.classList.remove('selected');
            });
            el.classList.add('selected');
            selectedCategoryId = parseInt(el.getAttribute('data-id'));
            selectedCategoryName = el.getAttribute('data-name');

            var tip = document.getElementById('other-remark-tip');
            if (selectedCategoryName === '其他支出') {
                tip.classList.remove('hidden');
            } else {
                tip.classList.add('hidden');
            }
        };

        function getCategoryBgColor(icon) {
            var colors = {
                restaurant: '#fef3c7',
                directions_car: '#e0f2fe',
                shopping_bag: '#ede9fe',
                movie: '#fce7f3',
                home: '#e0e7ff',
                medical_services: '#dcfce7',
                school: '#ccfbf1',
                group: '#fce7f3',
                payments: '#dcfce7',
                more_horiz: '#f1f5f9',
                default: '#dbeafe'
            };
            return colors[icon] || colors.default;
        }

        // ===== 同步主输入框与虚拟键盘 =====
        amountInput.addEventListener('input', function () {
            // 主输入框直接打字时，同步到 amountStr
            amountStr = amountInput.value.trim().replace(/[^0-9.]/g, '');
            updateAmountDisplay();
        });

        // ===== 保存账单 =====
        function submitBill() {
            // 优先从主输入框取值（直接打字），其次用 amountStr（虚拟键盘）
            var amount = parseFloat(amountInput.value) || parseFloat(amountStr);
            if (!amount || amount <= 0) {
                showToast('请输入金额');
                return;
            }
            if (!selectedCategoryId) {
                showToast('请选择分类');
                return;
            }

            var billTime = selectedDate
                ? (selectedDate + ' 00:00:00')
                : (originalBillTime || (function nowTime() {
                    var d = new Date();
                    return d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0') + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' +
                        String(d.getMinutes()).padStart(2, '0') + ':' +
                        String(d.getSeconds()).padStart(2, '0');
                })());

            keySave.disabled = true;
            keySave.textContent = '保存中...';

            var payload = {
                type: currentType,
                amount: amount,
                category_id: selectedCategoryId,
                remark: remarkInput.value.trim(),
                bill_time: billTime,
                tag_ids: selectedTagIds
            };

            function handleSave(result) {
                keySave.disabled = false;
                keySave.textContent = '保存';
                if (result.code === 0) {
                    window.location.href = 'home.html';
                } else {
                    showToast(result.msg || '保存失败');
                }
            }

            if (editId) {
                Auth.fetchApi('/bills/' + editId, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                }).then(handleSave);
                return;
            }

            Auth.fetchApi('/bills', {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(handleSave)
            .catch(function () {
                keySave.disabled = false;
                keySave.textContent = '保存';
                showToast('网络错误，请重试');
            });
        }

        // 主界面保存按钮
        document.getElementById('btn-save').addEventListener('click', submitBill);
        // 虚拟键盘保存按钮
        keySave.addEventListener('click', submitBill);

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-[100] bg-danger-expense text-white px-6 py-3 rounded-xl shadow-lg text-body-sm font-body-sm';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function () { toast.remove(); }, 2500);
        }

        // ===== 初始化：先加载分类，再检查编辑模式 =====
        // 初始化：加载标签列表
        loadTags();
        loadCategories('EXPENSE');

        var params = new URLSearchParams(window.location.search);
        editId = params.get('edit');

        if (editId) {
            // 编辑模式：加载账单数据并预填
            document.querySelector('h1').textContent = '修改账单';
            keySave.textContent = '保存';

            Auth.fetchApi('/bills/' + editId)
            .then(function (result) {
                if (result.code !== 0) {
                    showToast('加载账单失败');
                    return;
                }
                var bill = result.data;

                // 保留原始时间（编辑模式下保存时不再覆盖为当前时间）
                originalBillTime = bill.bill_time || '';

                // 预填日期（取日期部分，去掉时分秒）
                if (originalBillTime) {
                    selectedDate = originalBillTime.substring(0, 10);
                }

                // 设置金额
                amountStr = String(parseFloat(bill.amount).toFixed(2));
                updateAmountDisplay();

                // 设置备注
                remarkInput.value = bill.remark || '';

                // 回填标签
                if (bill.tags && bill.tags.length > 0) {
                    selectedTagIds = bill.tags.map(function (t) { return t.id; });
                }

                // 设置时间显示（仅显示日期）
                if (bill.bill_time) {
                    var timeStr = bill.bill_time;
                    if (timeStr.length >= 10) {
                        var datePart = timeStr.substring(0, 10);
                        var formatted = datePart.substring(0, 4) + '/' + datePart.substring(5, 7) + '/' + datePart.substring(8, 10);
                        document.getElementById('time-label').innerHTML = '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: \'FILL\' 1;">schedule</span>' + formatted;
                    }
                }

                // 设置账单类型并重新加载对应分类
                setActiveType(bill.type);

                // 分类渲染后自动选中
                setTimeout(function () {
                    var targetId = bill.category_id;
                    for (var i = 0; i < parents.length; i++) {
                        var p = parents[i];
                        if (p.id === targetId) {
                            selectParent(p.id);
                            setTimeout(function () {
                                var btn = document.querySelector('.child-btn[data-id="' + targetId + '"]');
                                if (btn) btn.click();
                            }, 50);
                            return;
                        }
                        for (var j = 0; j < p.children.length; j++) {
                            if (p.children[j].id === targetId) {
                                selectParent(p.id);
                                setTimeout(function () {
                                    var btn = document.querySelector('.child-btn[data-id="' + targetId + '"]');
                                    if (btn) btn.click();
                                }, 50);
                                return;
                            }
                        }
                    }
                }, 500);
            });
        }
    })();
    </script>
</body>
</html>
