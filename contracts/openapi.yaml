openapi: 3.0.3
info:
  title: 每日财务管家 API
  version: 1.0.0
  description: |
    项目唯一 API 真相源。Node 与 Java 两套后端共同实现此契约。

    **权威基准**：以 Java 后端的实现为权威，安全特性（账号锁定、Redis 可插拔、随机短信码）更完整。
    Node 后端的 12 项差异见 contracts/DIFFS.md。

    **维护规约**：改 API 必须先改本文件。详见 contracts/README.md。

servers:
  - url: http://localhost:3000
    description: Node 后端
  - url: http://localhost:8080
    description: Java 后端

tags:
  - name: auth
    description: 注册、登录、短信验证码、密码重置
  - name: user
    description: 用户资料、密码、手机绑定、头像
  - name: bills
    description: 账单 CRUD、统计、导出
  - name: categories
    description: 分类管理
  - name: budgets
    description: 预算与仪表盘
  - name: tags
    description: 账单标签
  - name: health
    description: 健康检查

security:
  - bearerAuth: []

paths:
  # ===== Health =====
  /api/health:
    get:
      tags: [health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 0
                msg: ok
                data:
                  status: ok
                  timestamp: '2026-06-08T12:00:00'

  # ===== Auth =====
  /api/auth/register:
    post:
      tags: [auth]
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: integer
                        format: int64
                        description: 新用户 ID
                      # x-implemented-by-node: Node 额外返回 {token, userId}，Java 仅返回 userId
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 手机号已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 409
                msg: 操作失败

  /api/auth/login:
    post:
      tags: [auth]
      summary: 密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 密码错误
        '404':
          description: 用户不存在
        '429':
          description: 登录失败次数过多（账号锁定 15 分钟）

  /api/auth/send-sms-code:
    post:
      tags: [auth]
      summary: 发送短信验证码
      description: |
        Java 后端真实发送（由 `app.sms.provider` 选择通道：`log` / `noop` / 未来 `aliyun`）。
        Node 后端当前返回 501，待补齐 —— DIFFS.md #2。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 手机号未注册
        '429':
          description: 发送过于频繁（60 秒内已发过）
        '503':
          description: 短信通道未开放或异常

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: 通过短信验证码重置密码
      description: Node 后端当前返回 501，待补齐 —— DIFFS.md #3。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, smsCode, newPassword]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                smsCode:
                  type: string
                  minLength: 6
                  maxLength: 6
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: 验证码错误/过期 或 密码不合规
        '404':
          description: 手机号未注册

  # ===== User =====
  /api/user/profile:
    get:
      tags: [user]
      summary: 获取当前用户资料
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '404':
          description: 用户不存在
    put:
      tags: [user]
      summary: 更新用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 至少提供一个字段
              properties:
                nickname:
                  type: string
                  maxLength: 50
                avatar_url:
                  type: string
                currency:
                  type: string
                  enum: [CNY, USD, EUR]
                theme:
                  type: string
                  enum: [light, dark]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: 没有需要更新的字段 / 昵称过长

  /api/user/password:
    put:
      tags: [user]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 旧密码错误

  /api/user/bind-phone:
    put:
      tags: [user]
      summary: 绑定手机号
      description: Java 后端尚未实现 —— DIFFS.md #5。
      x-implemented-by: [node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 该手机号已被其他账号绑定

  /api/user/unbind-phone:
    put:
      tags: [user]
      summary: 解绑手机号
      description: Java 后端尚未实现 —— DIFFS.md #5。
      x-implemented-by: [node]
      responses:
        '200':
          description: 解绑成功

  /api/user/upload-avatar:
    post:
      tags: [user]
      summary: 上传头像
      description: Java 后端尚未实现 —— DIFFS.md #5。
      x-implemented-by: [node]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 图片文件，最大 2 MiB，MIME jpeg/png/gif/webp
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: object
                        properties:
                          url:
                            type: string
                            example: /uploads/avatars/user_1_1780000000.jpg
        '400':
          description: 未选择文件 / 大小超限 / 类型不支持

  # ===== Bills =====
  /api/bills:
    get:
      tags: [bills]
      summary: 账单列表（分页 + 多条件筛选）
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: 按月筛选 YYYY-MM
        - name: category_id
          in: query
          schema: { type: integer }
        - name: type
          in: query
          schema: { type: string, enum: [expense, income, EXPENSE, INCOME] }
          description: 大小写不敏感，服务端统一大写化
        - name: keyword
          in: query
          schema: { type: string }
          description: 备注模糊搜索
        - name: tag_id
          in: query
          schema: { type: integer }
          description: 按标签过滤。Java 后端待支持 —— DIFFS.md #7
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: object
                        required: [list, total, page, pageSize]
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/BillListItem' }
                          total: { type: integer }
                          page: { type: integer }
                          pageSize: { type: integer }
    post:
      tags: [bills]
      summary: 创建账单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillUpsert'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/bills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [bills]
      summary: 账单详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data: { $ref: '#/components/schemas/BillDetail' }
        '404':
          description: 账单不存在
    put:
      tags: [bills]
      summary: 更新账单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillUpsert'
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 账单不存在
    delete:
      tags: [bills]
      summary: 删除账单
      responses:
        '200':
          description: 成功
        '404':
          description: 账单不存在

  /api/bills/export:
    get:
      tags: [bills]
      summary: 导出账单 CSV/Excel
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
        - name: month
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [EXPENSE, INCOME] }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: keyword
          in: query
          schema: { type: string }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 二进制下载流
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400':
          description: 行数超过 50000

  /api/bills/stats/month:
    get:
      tags: [bills]
      summary: 月度统计（含环比）
      description: |
        响应结构两端不一致：
        - Node 把 change 嵌在 expense.change / income.change
        - Java 平铺 expenseChange / incomeChange

        本契约采用 Node 的嵌入式结构（语义更清晰）。Java 待重构 —— DIFFS.md #9。
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data: { $ref: '#/components/schemas/MonthStats' }

  # ===== Categories =====
  /api/categories:
    get:
      tags: [categories]
      summary: 分类列表
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [expense, income, EXPENSE, INCOME] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [categories]
      summary: 创建自定义分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, maxLength: 20 }
                icon: { type: string }
                type: { type: string, enum: [EXPENSE, INCOME] }
                parent_id: { type: integer, default: 0 }
                sort_order: { type: integer, default: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
        '400':
          description: 名称/类型缺失 或 名称超长（**Java 当前未校验** —— DIFFS.md #12）

  /api/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [categories]
      summary: 更新分类（仅自定义）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 20 }
                icon: { type: string }
                sort_order: { type: integer }
      responses:
        '200':
          description: 成功
        '400':
          description: 没有需要更新的字段
        '404':
          description: 分类不存在
    delete:
      tags: [categories]
      summary: 删除分类（仅自定义；有账单则软归档）
      responses:
        '200':
          description: 已删除或已归档
        '404':
          description: 分类不存在或为系统预设

  # ===== Budgets =====
  /api/budgets:
    get:
      tags: [budgets]
      summary: 预算列表
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [total, category] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Budget' }
    post:
      tags: [budgets]
      summary: 创建/更新预算（upsert）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                category_id: { type: integer, default: 0, description: 0=总预算 }
                amount: { type: number, exclusiveMinimum: 0 }
                period: { type: string, enum: [MONTHLY], default: MONTHLY }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        oneOf:
                          - type: integer
                            format: int64
                          - type: object
                            properties:
                              id: { type: integer, format: int64 }
                        description: |
                          Node 返回 {id}，Java 返回 Long。
                          本契约目标：统一为 {id} —— DIFFS.md #11。

  /api/budgets/dashboard:
    get:
      tags: [budgets]
      summary: 预算仪表盘
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data: { $ref: '#/components/schemas/BudgetDashboard' }

  /api/budgets/{id}:
    delete:
      tags: [budgets]
      summary: 软删除预算（is_active=0）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已停用
        '404':
          description: 预算不存在

  # ===== Tags =====
  /finance/tags:
    get:
      tags: [tags]
      summary: 标签列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Tag' }
                          - type: array
                            items: { $ref: '#/components/schemas/Tag' }
                        description: |
                          Node 包了一层 {list:[...]}, Java 直接返回数组。
                          本契约目标：统一为 {list:[...]} —— DIFFS.md #13。
    post:
      tags: [tags]
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 成功
        '400':
          description: 名称空 / 超长 / 重名

  /finance/tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [tags]
      summary: 重命名标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 16 }
      responses:
        '200': { description: 成功 }
        '400': { description: 名称空/超长/重名 }
        '404': { description: 标签不存在 }
    delete:
      tags: [tags]
      summary: 删除标签（同时解关联）
      responses:
        '200': { description: 成功 }
        '404': { description: 标签不存在 }

components:
  # ---- 共享业务常量 ----
  # 用 x-constants 扩展字段集中声明，两端代码应从配置/常量类读取，不再硬编码。
  x-constants:
    password:
      minLength: 6
      maxLength: 20
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).+$'
      bcryptCost: 10
    phone:
      pattern: '^\d{8,15}$'
      defaultCountryCode: '+86'
    login:
      maxAttempts: 5
      lockWindowMs: 900000
    sms:
      codeLength: 6
      ttlSeconds: 300
      sendIntervalMs: 60000
    jwt:
      expirationMs: 604800000
      header: 'Authorization: Bearer {token}'
    bills:
      maxPageSize: 100
      defaultPageSize: 50
      remarkMaxLength: 200
      tagsPerBillMax: 10
      exportMaxRows: 50000
      typeEnum: [EXPENSE, INCOME]
    category:
      nameMaxLength: 20
    tag:
      nameMaxLength: 16
    nickname:
      maxLength: 50  # 注意：Java 的 Constants.MAX_NICKNAME_LENGTH=32 是死代码
    avatar:
      maxBytes: 2097152  # 2 MiB
      mimeWhitelist: [image/jpeg, image/png, image/gif, image/webp]
    rateLimit:
      authPerWindow: 30
      globalPerWindow: 300
      windowMs: 900000

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
          example:
            code: 400
            msg: 手机号格式不正确

  schemas:
    # ---- 通用包装 ----
    Result:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0=成功；非 0=业务错误（值常对应 HTTP code）
        msg:
          type: string
        data:
          description: 业务数据，类型见各端点

    # ---- 共享原子类型 ----
    Phone:
      type: string
      pattern: '^\d{8,15}$'
      example: '13800000000'

    Password:
      type: string
      minLength: 6
      maxLength: 20
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).+$'
      example: 'P@ssw0rd'
      description: 6-20 位，必须含大小写字母、数字、特殊字符

    # ---- Auth ----
    RegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password: { $ref: '#/components/schemas/Password' }
        nickname:
          type: string
          maxLength: 50
          description: 缺省时使用手机号脱敏 \d{3}****\d{4}

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password:
          type: string

    LoginResult:
      type: object
      required: [token, userId]
      properties:
        token: { type: string }
        userId: { type: integer, format: int64 }
        nickname: { type: string }

    # ---- User ----
    UserProfile:
      type: object
      required: [id, phone]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }
        phone: { type: string }
        country_code: { type: string }
        currency: { type: string }
        theme: { type: string }
        status: { type: integer, enum: [0, 1] }
        created_at: { type: string }

    # ---- Bills ----
    BillUpsert:
      type: object
      properties:
        type:
          type: string
          enum: [EXPENSE, INCOME]
        amount:
          type: number
          exclusiveMinimum: 0
        category_id:
          type: integer
          format: int64
        remark:
          type: string
          maxLength: 200
        bill_time:
          type: string
          description: 'yyyy-MM-dd HH:mm:ss；缺省=now'
        tag_ids:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }

    BillListItem:
      type: object
      required: [id, type, amount, category_id, bill_time]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        type: { type: string, enum: [EXPENSE, INCOME] }
        amount: { type: number }
        category_id: { type: integer, format: int64 }
        category_name: { type: string }
        category_icon: { type: string }
        remark: { type: string }
        bill_time: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        tags:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }

    BillDetail:
      allOf:
        - $ref: '#/components/schemas/BillListItem'

    MonthStats:
      type: object
      required: [expense, income, daily, categories]
      properties:
        expense:
          $ref: '#/components/schemas/StatsBucket'
        income:
          $ref: '#/components/schemas/StatsBucket'
        daily:
          type: array
          maxItems: 30
          items:
            type: object
            properties:
              date: { type: string, format: date }
              expense: { type: number }
              income: { type: number }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              icon: { type: string }
              total: { type: number }
              count: { type: integer }

    StatsBucket:
      type: object
      required: [total, count]
      properties:
        total: { type: number }
        count: { type: integer }
        change:
          type: number
          nullable: true
          description: 环比上月百分比，上月为 0 时为 null；保留 1 位小数

    # ---- Categories ----
    Category:
      type: object
      required: [id, name, type]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        icon: { type: string }
        type: { type: string, enum: [EXPENSE, INCOME] }
        parent_id: { type: integer, format: int64 }
        sort_order: { type: integer }
        is_preset: { type: integer, enum: [0, 1] }
        is_archived: { type: integer, enum: [0, 1] }
        user_id: { type: integer, format: int64, description: '0=系统预设' }
        created_at: { type: string }

    # ---- Budgets ----
    Budget:
      type: object
      required: [id, amount, period]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        category_id: { type: integer, format: int64, description: '0=总预算' }
        amount: { type: number }
        period: { type: string, enum: [MONTHLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        is_active: { type: integer, enum: [0, 1] }
        category_name: { type: string }
        category_icon: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    BudgetDashboard:
      type: object
      required: [total_budget, spent, remaining, percent, categories]
      properties:
        total_budget: { type: number }
        spent: { type: number }
        remaining: { type: number }
        percent: { type: integer, minimum: 0, maximum: 100 }
        categories:
          type: array
          items:
            type: object
            properties:
              budget_id: { type: integer, format: int64 }
              cat_id: { type: integer, format: int64 }
              category_name: { type: string }
              category_icon: { type: string }
              budget_amount: { type: number }
              spent: { type: number }
              percent: { type: integer }
              remaining: { type: number }

    # ---- Tags ----
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 16 }
        bill_count: { type: integer }
