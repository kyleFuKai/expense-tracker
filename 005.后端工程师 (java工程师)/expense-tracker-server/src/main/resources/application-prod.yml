spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

# prod 默认走 Redis，多实例共享登录失败计数与短信验证码
app:
  session-store: ${SESSION_STORE:redis}
  session-store-prefix: ${SESSION_STORE_PREFIX:expense-tracker}
  login:
    max-attempts: 5
    lock-window-ms: 900000
  sms:
    # prod 默认 noop —— 接入真通道前宁可显式拒绝，也不要 666666 暗门
    provider: ${SMS_PROVIDER:noop}

logging:
  level:
    root: WARN
    com.xingzhewk: INFO
